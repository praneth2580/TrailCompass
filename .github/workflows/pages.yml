# Publishes the GitHub Pages site: the landing page (site/) and the fuel and
# food data the app downloads (poi/). Pages replaces the whole site on every
# deploy, so both are always published together.
#
# - Every Monday: rebuilds the data when Overture Maps has a new release
#   (about monthly) and publishes it with the landing page.
# - Push to main that changes the landing page: republishes it, carrying
#   over the data that is already live.
# - Run workflow: republishes now; tick "force" to rebuild the data too.
#
# Site layout:
#   index.html, styles.css, …    the landing page
#   poi/manifest.json            the latest data release and its tile lists
#   poi/<release>/<kind>/*.json  that release's tiles (read by src/services/poi-data.service.ts)
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publish site

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the fuel and food data even if it is already on the latest Overture release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide what to publish
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          release_pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$'
          latest=$(curl -fsSL --retry 3 https://stac.overturemaps.org/catalog.json | jq -r .latest)
          if [[ ! "$latest" =~ $release_pattern ]]; then
            echo "::error::Unexpected Overture release name: $latest"
            exit 1
          fi

          # The live manifest is both the data to carry over and the baseline
          # for the drop check; before the first publish, the bundled copy.
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          published=""
          if curl -fsSL --retry 3 "$site/poi/manifest.json" -o "$RUNNER_TEMP/previous.json"; then
            published=$(jq -r '.release // ""' "$RUNNER_TEMP/previous.json")
            if [[ ! "$published" =~ $release_pattern ]]; then
              echo "::error::Unexpected published release name: $published"
              exit 1
            fi
          else
            cp public/assets/poi/manifest.json "$RUNNER_TEMP/previous.json"
          fi
          echo "Overture latest: $latest; published: ${published:-nothing yet}"

          build_data=false
          if [[ "$latest" != "$published" || "$FORCE" == "true" ]]; then
            build_data=true
          fi
          # Scheduled runs only publish new data; pushes and manual runs always publish.
          deploy=true
          if [[ "$EVENT" == "schedule" && "$build_data" != "true" ]]; then
            echo "The published data is already on $latest."
            deploy=false
          fi
          {
            echo "site=$site"
            echo "latest=$latest"
            echo "published=$published"
            echo "build_data=$build_data"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

      - name: Build the fuel and food data
        if: steps.plan.outputs.deploy == 'true' && steps.plan.outputs.build_data == 'true'
        env:
          RELEASE: ${{ steps.plan.outputs.latest }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet duckdb==1.5.6
          "$RUNNER_TEMP/venv/bin/python" scripts/build-poi-tiles.py \
            --release "$RELEASE" \
            --out "_site/poi/$RELEASE" \
            --previous "$RUNNER_TEMP/previous.json"
          cp "_site/poi/$RELEASE/manifest.json" _site/poi/manifest.json

      - name: Carry over the published fuel and food data
        if: steps.plan.outputs.deploy == 'true' && steps.plan.outputs.build_data != 'true'
        env:
          SITE: ${{ steps.plan.outputs.site }}
          RELEASE: ${{ steps.plan.outputs.published }}
        run: |
          dest="_site/poi/$RELEASE"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/previous.json" _site/poi/manifest.json
          cp "$RUNNER_TEMP/previous.json" "$dest/manifest.json"
          jq -r '.kinds | to_entries[] | select(.key == "fuel" or .key == "food")
                 | .key as $kind | .value.tiles[] | select(test("^-?[0-9]{1,3}_-?[0-9]{1,2}$"))
                 | "\($kind)/\(.).json"' "$RUNNER_TEMP/previous.json" \
            | while read -r file; do
                printf 'url = "%s/poi/%s/%s"\noutput = "%s/%s"\n' "$SITE" "$RELEASE" "$file" "$dest" "$file"
              done > "$RUNNER_TEMP/tiles.curl"
          # Any failed tile fails the run, so a deploy never drops live data.
          curl --fail --silent --show-error --retry 3 --create-dirs \
            --parallel --parallel-max 8 --config "$RUNNER_TEMP/tiles.curl"
          echo "Carried over $(find "$dest" -name '*.json' ! -name manifest.json | wc -l) tiles of $RELEASE"

      - name: Build the landing page
        if: steps.plan.outputs.deploy == 'true'
        run: |
          node scripts/build-site.mjs --out _site
          cp public/assets/poi/README.md _site/poi/README.md

      - name: Upload the site
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
